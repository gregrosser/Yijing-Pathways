* { box-sizing: border-box; }
body {

}
h1 { font-family: var(--font-display); font-weight: 400; font-size: 1.9rem; margin: 0; text-wrap: balance; text-align: center; min-height: 2.4em; display: flex; align-items: center; justify-content: center; }

.spine-svg text.f0 { font-family: var(--font-mono); font-size: 5.68px; }

.next-link, .prev-link { display: inline-flex; align-items: center; justify-content: center; transition: transform 0.15s ease; }
.next-link svg circle, .prev-link svg circle { transition: fill 0.15s ease; }
.next-link:hover svg circle, .prev-link:hover svg circle { fill: var(--paper-panel); }
.next-link:hover, .prev-link:hover { transform: scale(1.08); }
.nav-center { display: flex; flex-direction: column; align-items: center; gap: 4px; font-family: var(--font-body); }
.nav-count { font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-faint); }
.nav-home { font-size: 0.82rem; color: var(--ink-soft); text-decoration: none; }
.nav-home:hover { color: var(--seal); }

.name-tag {

  font-weight: 700;
  font-size: 3.2rem;
  padding: 18px 41px;
  margin-top: 40px;
