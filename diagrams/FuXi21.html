<title>FuXi21</title>
<style>
:root {
  --paper: #f2ecdc;
  --paper-panel: #eae2cc;
  --ink: #201d16;
  --ink-soft: #6b6355;
  --ink-faint: #b8ae96;
  --seal: #a23b2e;
  --verify: #2e7d32;
  --rule: #c9bfa2;
  --gridline: #ded4b8;
  --font-display: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
:root[data-theme="dark"] {
  --paper: #181510; --paper-panel: #201c15; --ink: #e9e1cd;
  --ink-soft: #a89d84; --ink-faint: #55503f; --seal: #e2725a;
  --verify: #4caf50;
  --rule: #3a3527; --gridline: #2c2820;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #181510; --paper-panel: #201c15; --ink: #e9e1cd;
    --ink-soft: #a89d84; --ink-faint: #55503f; --seal: #e2725a;
    --verify: #4caf50;
    --rule: #3a3527; --gridline: #2c2820;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--font-body); padding: 48px 24px 80px;
  display: flex; flex-direction: column; align-items: center; gap: 28px;
}
.masthead { max-width: 600px; text-align: center; display: flex; flex-direction: column; gap: 10px; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: 1.9rem; margin: 0; text-wrap: balance; }
.subhead { font-family: var(--font-mono); font-size: 0.76rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--seal); }
.caption { font-size: 0.95rem; line-height: 1.55; color: var(--ink-soft); text-wrap: pretty; }
.stage { width: min(85vw, 713px); aspect-ratio: 1 / 1; pointer-events: none; }
.stage svg { width: 100%; height: 100%; display: block; overflow: visible; pointer-events: none; }
.ring { fill: none; stroke: var(--gridline); stroke-width: 1; }
.spoke { display: none; }
.bar { stroke: var(--ink); stroke-width: 3; stroke-linecap: round; }
.hub { fill: var(--paper); stroke: var(--rule); stroke-width: 1; }
.num-label text { font-family: var(--font-mono); font-size: 9px; fill: var(--ink); }
.num-label { cursor: pointer; pointer-events: auto; }
.num-label.active text { fill: var(--seal); }
.glyph.active .bar { stroke: var(--seal); }
.distance-link { fill: none; stroke: var(--verify); stroke-width: 1.5; opacity: 0.85; }
.distance-tick { stroke: var(--verify); stroke-width: 1.5; opacity: 0.85; }
.distance-label-bg { fill: var(--paper); stroke: var(--verify); stroke-width: 1.5; }
.distance-label-text { font-family: var(--font-mono); font-size: 16px; font-weight: 700; fill: var(--verify); text-anchor: middle; dominant-baseline: central; }
.diametric-line { stroke: var(--verify); stroke-width: 1.5; opacity: 0.85; }
.axis-line { stroke: var(--verify); stroke-width: 1; stroke-dasharray: 6 5; opacity: 0.6; }
.glyph.grouped .bar { stroke: var(--verify); }
.num-label.grouped text { fill: var(--verify); }
.num-label { cursor: pointer; pointer-events: auto; }
.legend { display: flex; gap: 28px; font-size: 0.86rem; color: var(--ink-soft); }
.legend-item { display: flex; align-items: center; gap: 10px; }
.swatch { width: 30px; height: 8px; background: var(--ink); border-radius: 2px; }
.swatch-yin { display: flex; gap: 5px; width: 30px; }
.swatch-yin span { flex: 1; height: 8px; background: var(--ink); border-radius: 2px; }

.pair-display {
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  background: var(--paper-panel);
  border: 1px solid var(--rule);
  border-radius: 8px;
  padding: 24px 32px;
  zoom: 0.612;
  margin-top: -168px;
}
.pair-display.active { display: flex; }
.pd-caption { font-family: var(--font-mono); font-size: 0.8rem; color: var(--seal); letter-spacing: 0.02em; }
.pd-slots { display: flex; align-items: flex-start; gap: 56px; }
.pd-pair { display: flex; align-items: flex-start; gap: 22px; }
.pd-hex { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.pd-hex .pd-glyph rect { fill: var(--ink); }
.pd-num { font-family: var(--font-mono); font-size: 1.05rem; color: var(--ink-soft); }
</style>

  var p1 = pt(r, startTheta);
  var p2 = pt(r, endTheta);
  return 'M ' + p1[0].toFixed(2) + ' ' + p1[1].toFixed(2) +
    ' A ' + r + ' ' + r + ' 0 0 0 ' + p2[0].toFixed(2) + ' ' + p2[1].toFixed(2);
}

function buildDistanceLink(p, q, dist, arcR, tickR) {
  var a = ((thetaForLabel(p) % 360) + 360) % 360;
  var b = ((thetaForLabel(q) % 360) + 360) % 360;
  var diff = ((b - a) % 360 + 360) % 360;
  var start, end;
  if (diff <= 180) { start = a; end = a + diff; }
  else { start = b; end = b + (360 - diff); }
  var mid = (start + end) / 2;
  var halfDelta = Math.asin(LABEL_R / (2 * arcR)) * 180 / Math.PI;

  overlay.appendChild(svgEl('path', { d: arcPath(start, mid - halfDelta, arcR), class: 'distance-link' }));
  overlay.appendChild(svgEl('path', { d: arcPath(mid + halfDelta, end, arcR), class: 'distance-link' }));

  [start, end].forEach(function (theta) {
    var p1 = pt(arcR, theta), p2 = pt(tickR, theta);
    overlay.appendChild(svgEl('line', {
      x1: p1[0].toFixed(2), y1: p1[1].toFixed(2),
      x2: p2[0].toFixed(2), y2: p2[1].toFixed(2), class: 'distance-tick'
    }));
  });

  var mp = pt(arcR, mid);
  overlay.appendChild(svgEl('circle', { cx: mp[0].toFixed(2), cy: mp[1].toFixed(2), r: LABEL_R, class: 'distance-label-bg' }));
  var textEl = svgEl('text', { x: mp[0].toFixed(2), y: mp[1].toFixed(2), dy: '0.5', class: 'distance-label-text' });
  textEl.textContent = dist;
  overlay.appendChild(textEl);
}

var R_LINE_END = 240;
var R_AXIS = 400;

function buildDiametricLine(p, q) {
  var p1 = pt(R_LINE_END, thetaForLabel(p));
  var p2 = pt(R_LINE_END, thetaForLabel(q));
  overlay.appendChild(svgEl('line', {
    x1: p1[0].toFixed(2), y1: p1[1].toFixed(2),
    x2: p2[0].toFixed(2), y2: p2[1].toFixed(2), class: 'diametric-line'
  }));
}

var R_AXIS_GAP_INNER = R_LINE_END, R_AXIS_GAP_OUTER = 325;

function buildAxisLine(axisMembers) {
  var theta = thetaForLabel(axisMembers[0]);
  // signed radius: pt(-r, theta) === pt(r, theta+180), so one theta covers both sides
  var segments = [
    [-R_AXIS, -R_AXIS_GAP_OUTER],
    [-R_AXIS_GAP_INNER, R_AXIS_GAP_INNER],
    [R_AXIS_GAP_OUTER, R_AXIS]
  ];
  segments.forEach(function (seg) {
    var p1 = pt(seg[0], theta);
    var p2 = pt(seg[1], theta);
    overlay.appendChild(svgEl('line', {
      x1: p1[0].toFixed(2), y1: p1[1].toFixed(2),
      x2: p2[0].toFixed(2), y2: p2[1].toFixed(2), class: 'axis-line'
    }));
  });
}

function clearGroup() {
  document.querySelectorAll('.grouped').forEach(function (el) { el.classList.remove('grouped'); });
  overlay.innerHTML = '';
  currentGroupId = null;
  clearPairDisplay();
}

function renderGroup(g, arcR, tickR) {
  g.members.forEach(function (m) {
    ['glyph-' + m, 'glyph-outer-' + m, 'num-' + m].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.classList.add('grouped');
    });
  });
  if (g.type === 'quartet') {
    g.pairs.forEach(function (pair) { buildDistanceLink(pair[0], pair[1], g.distance, arcR, tickR); });
    buildDiametricLine(g.members[0], g.members[1]);
    buildDiametricLine(g.members[2], g.members[3]);
  } else if (g.type === 'pair') {
    buildDiametricLine(g.members[0], g.members[1]);
  }
}

function showGroup(groupId) {
  clearGroup();
  var g = GROUPS[groupId];
  currentGroupId = groupId;
  renderPairDisplay(g);
  renderGroup(g, R_ARC, R_TICK);
}

document.querySelectorAll('[data-num]').forEach(function (numEl) {
  numEl.addEventListener('click', function () {
    var n = parseInt(numEl.getAttribute('data-num'), 10);
    var groupId = HEX_TO_GROUP[n];
    if (currentGroupId === groupId) { clearGroup(); }
    else { showGroup(groupId); }
  });
});

document.addEventListener('click', function (e) {
  if (!e.target.closest('.stage') && !e.target.closest('.pair-display')) {
    clearGroup();
  }
});
</script>
