<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">

<title>Spine — Page 2 — KW</title>
<style>
:root {
  --paper: #f2ecdc;
  --paper-panel: #eae2cc;
  --ink: #201d16;
  --ink-soft: #6b6355;
  --ink-faint: #b8ae96;
  --seal: #a23b2e;
  --rule: #c9bfa2;
  --font-display: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
:root[data-theme="dark"] {
  --paper: #181510; --paper-panel: #201c15; --ink: #e9e1cd;
  --ink-soft: #a89d84; --ink-faint: #55503f; --seal: #e2725a; --rule: #3a3527;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #181510; --paper-panel: #201c15; --ink: #e9e1cd;
    --ink-soft: #a89d84; --ink-faint: #55503f; --seal: #e2725a; --rule: #3a3527;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--font-body); padding: 448px 24px 80px;
  display: flex; flex-direction: column; align-items: center;
}
h1 { font-family: var(--font-display); font-weight: 400; font-size: 1.9rem; margin: 0; text-wrap: balance; text-align: center; }

:root { --page-w: min(4056px, 100%); --page-gap: 200px; --page-divider: 1px; }
.page-columns { display: grid; grid-template-columns: 1fr auto 1fr; gap: var(--page-gap); align-items: start; width: var(--page-w); }
.panel { display: flex; flex-direction: column; align-items: center; gap: 20px; min-width: 0; max-width: 100%; }
.divider { width: var(--page-divider); align-self: stretch; background: var(--rule); }
/* Single-panel pages have no grid siblings to size against, so without
   this a lone FX/KW panel would fall back to the browser's intrinsic SVG
   size instead of the same per-column width a combined page's panel gets
   -- making the rendered scale jump between pages as you click "next".
   This reproduces the exact width one grid column would resolve to. */
.single-panel-wrap { width: calc((var(--page-w) - 2 * var(--page-gap) - var(--page-divider)) / 2); margin: 0 auto; }
.single-panel-wrap--diagram { width: min(1900px, 96vw); }

.spine-svg { width: 100%; height: auto; display: block; }
.ribbon { stroke-width: 1; opacity: 1; }
.ribbon-3132 { fill: var(--ink-faint); fill-opacity: 0.8; stroke: var(--ink-faint); }
.ribbon-3334 { fill: var(--ink); fill-opacity: 0.8; stroke: var(--ink); }
.pair-ellipse-3132 { fill: none; stroke: var(--ink-faint); stroke-width: 6; }
.pair-ellipse-3334 { fill: none; stroke: var(--ink); stroke-width: 6; }
.group-circle-3132 { fill: none; stroke: var(--ink-faint); stroke-width: 8; }
.group-circle-3334 { fill: none; stroke: var(--ink); stroke-width: 8; }
.num, .num-self { fill: var(--paper); stroke: var(--ink); stroke-width: 1.5; }
.num-circle-hidden { fill: transparent; stroke: transparent; }
.num-text, .num-self-text { font-family: var(--font-mono); font-weight: 400; font-size: 18.63px; fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
.rel-mark { fill: var(--ink-faint); }
.spine-svg text.f0 { font-family: var(--font-mono); font-size: 5.68px; }

.nav-row { width: 100%; display: flex; align-items: center; justify-content: center; gap: 32px; margin-top: 40px; }
.next-link, .prev-link { display: inline-flex; align-items: center; justify-content: center; transition: transform 0.15s ease; }
.next-link svg circle, .prev-link svg circle { transition: fill 0.15s ease; }
.next-link:hover svg circle, .prev-link:hover svg circle { fill: var(--paper-panel); }
.next-link:hover, .prev-link:hover { transform: scale(1.08); }
.nav-center { display: flex; flex-direction: column; align-items: center; gap: 4px; font-family: var(--font-body); }
.nav-count { font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-faint); }
.nav-home { font-size: 0.82rem; color: var(--ink-soft); text-decoration: none; }
.nav-home:hover { color: var(--seal); }

.name-tag {
  display: inline-block;
  font-family: var(--font-body);
  font-weight: 700;
  font-size: 3.2rem;
  padding: 18px 41px;
  margin-top: 40px;
  border: 12pt solid var(--ink);
  border-radius: 36px;
  color: var(--ink);
  background: var(--paper);
}
</style>
